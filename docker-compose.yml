services:
  c-api:
    build: .
    image: equaltoken/c-api:latest
    container_name: equaltoken-c-api
    restart: unless-stopped
    ports:
      - "8787:8787"
    # 密钥不进镜像：在宿主机准备 bff/.env（cp .env.example .env 后填写），
    # 由 compose 注入容器环境变量
    env_file:
      - bff/.env
    networks:
      default:
        ipv4_address: 172.20.0.2

networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16
